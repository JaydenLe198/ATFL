# ATFL config: SMD + FedProx

ray:
  num_cpus: 32
  num_gpus: 4
  ignore_reinit_error: true

resources:
  client:
    num_cpus: 4
    num_gpus: 1.0

simulation:
  num_clients: 28
  total_rounds: 30
  fraction_fit: 0.25
  fraction_evaluate: 0.0
  min_available_clients: 8
  min_fit_clients: 8
  strict_num_clients: true

strategy:
  type: fedprox

training:
  local_epochs: 5
  lr: 1.0e-4
  proximal_mu: 0.01

model:
  seq_len: 100
  enc_in: 38
  c_out: 38
  d_model: 512
  n_heads: 8
  e_layers: 3

data:
  dataset: SMD
  partition_mode: by_machine
  batch_size: 64
  seq_length: 100
  step: 1
  centralized_cache: false
  client_load_test: false

evaluation:
  enabled: true
  batch_size: 128
  results_dir: eval_results/smd_fedprox

scaffold:
  damping: 0.1

wandb:
  enabled: true
  project: ATFL
  entity: huyln
  run_name: smd_fedprox_30r
  tags: [smd, fedprox, atfl]
